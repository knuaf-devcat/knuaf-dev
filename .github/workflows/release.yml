name: release
# 태그를 달면 맥용 설치본을 만들어 GitHub Releases에 **초안(draft)**으로 올린다.
# 초안인 이유: 서명이 없는 동안에는 사람이 받아서 한 번 열어보고 공개해야 한다.
#
# 서명·공증은 Apple Developer 계정이 생기면 저장소 시크릿만 넣으면 켜진다
# (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID).
# 없으면 electron-builder가 서명을 건너뛰고 after-sign.mjs가 임시(ad-hoc) 서명만 한다.
# 그 빌드는 Gatekeeper가 막으므로 릴리스 본문에 해제 방법을 함께 싣는다.
#
# Windows 설치본(NSIS)은 아래 `windows` job 이 만든다 — W1 에서 윈도우 e2e 가 초록이 된 뒤
# 추가했다. 서명 인증서가 없어(형님 결정) 서명 설정·시크릿을 쓰지 않는다. 처음 실행의
# SmartScreen 경고는 docs/설치-안내-Windows.md 안내로 넘긴다.
# 태그 배포 **전용**이다. 설치본이 만들어지는지 확인만 하려면 `.github/workflows/
# build-installers.yml`(workflow_dispatch 전용, 비밀값·서명·공증 없음)을 쓴다 —
# 이 워크플로를 브랜치에서 수동 실행하면 서명·공증 자격이 쓰일 수 있기 때문이다(W2-R1-01).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ci.yml 은 `branches: ["**"]` 라서 태그 푸시에는 돌지 않는다.
  # 검증되지 않은 커밋이 설치본이 되지 않도록 여기서 다시 돈다.
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/knuaf-dev/scripts/requirements-runtime.txt
      - run: python -m pip install -r skills/knuaf-dev/scripts/requirements-runtime.txt pytest pytest-timeout
      - run: python -m pytest
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm typecheck
        working-directory: app
      - run: pnpm build
        working-directory: app
      - run: pnpm exec playwright test --grep-invert "screenshots|real window capture"
        working-directory: app
        env:
          # 맨이름은 안 된다 — 앱이 existsSync 로 걸러 조용히 폴백하고, PATH 를 좁히는
          # 스펙에서 macOS 기본 3.9 를 집어 project:open 이 실패한다(ci.yml 과 같은 수정).
          KNUAF_PYTHON: ${{ env.pythonLocation }}/bin/python

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 버전이 네 군데(태그·app/package.json·두 plugin.json)에 흩어져 있고 일치를
      # 확인하는 장치가 없었다. 어긋난 채 배포하면 학생이 받은 앱과 스킬 버전이 달라진다.
      - name: 태그와 선언된 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          for f in app/package.json .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            got=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$f")
            [ "$got" = "$tag" ] || { echo "::error file=$f::버전 불일치 — 태그 $tag / 파일 $got"; fail=1; }
          done
          exit $fail

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # dist:mac = build → prepare:resources(번들 CPython·휠하우스·아이콘·안내 PDF·스킬) → electron-builder.
      # PBS_SHA256 은 선택이다. 없으면 fetch-python.mjs 가 릴리스의 SHA256SUMS 를 받아 대조한다.
      #
      # 서명 자격을 "있을 때만" 내보낸다. 시크릿이 없으면 ${{ }} 가 빈 문자열로 펼쳐지고,
      # env: 에 그대로 쓰면 CSC_LINK 가 "정의됐지만 빈 값"이 된다. electron-builder 는
      # 정의된 CSC_LINK 를 인증서 파일 경로로 읽으므로 빈 값은 작업 디렉터리로 풀려
      #   ⨯ .../app not a file
      # 로 죽는다. 로컬에서는 변수 자체가 없어 정상 통과하던 것이 CI 에서만 터졌다.
      - name: 설치본 빌드
        working-directory: app
        run: |
          if [ -n "$IN_CSC_LINK" ]; then export CSC_LINK="$IN_CSC_LINK"; fi
          if [ -n "$IN_CSC_KEY_PASSWORD" ]; then export CSC_KEY_PASSWORD="$IN_CSC_KEY_PASSWORD"; fi
          if [ -n "$IN_APPLE_ID" ]; then export APPLE_ID="$IN_APPLE_ID"; fi
          if [ -n "$IN_APPLE_APP_SPECIFIC_PASSWORD" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$IN_APPLE_APP_SPECIFIC_PASSWORD"; fi
          if [ -n "$IN_APPLE_TEAM_ID" ]; then export APPLE_TEAM_ID="$IN_APPLE_TEAM_ID"; fi
          pnpm dist:mac
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # 서명이 실제로 붙었는지 기록에 남긴다. adhoc 이면 릴리스 본문이 해제 안내를 달고,
      # 정식 서명이면 그 문단을 뺀다 — 안내가 사실과 어긋나지 않게 빌드가 직접 판정한다.
      - name: 서명 상태 확인
        id: sign
        working-directory: app
        run: |
          app=$(find dist -maxdepth 2 -name "*.app" -print -quit)
          echo "검사 대상: $app"
          codesign -dv "$app" 2>&1 | tee /tmp/codesign.txt || true
          if grep -q "Signature=adhoc" /tmp/codesign.txt; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          spctl -a -vv "$app" 2>&1 || true

      - name: 체크섬 생성
        working-directory: app/dist
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt

      - name: 릴리스 초안 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        working-directory: app/dist
        run: |
          {
            echo "> [!WARNING]"
            echo "> **초기 베타입니다.** 아직 실사용 검증이 충분하지 않습니다."
            echo "> 실제 제출용 논문에 쓰시기 전에 원본 답변·자료를 따로 백업해 두세요."
            echo
            echo "## 설치"
            echo
            echo "\`.dmg\` 를 내려받아 여세요."
            echo
            if [ "$SIGNED" != "true" ]; then
              cat ../../docs/설치-안내-macOS.md
            fi
            echo
            echo "## 확인"
            echo
            echo "이 빌드는 서명 상태를 빌드가 직접 판정해 기록합니다 — 정식 서명: \`$SIGNED\`."
            echo "파일 무결성은 \`SHA256SUMS-macos.txt\`(macOS)·\`SHA256SUMS-windows.txt\`(Windows) 로 확인할 수 있습니다."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            *.dmg *.zip SHA256SUMS-macos.txt

  # 윈도우 설치본(NSIS, 서명 없음). 맥 job 과 같은 트리거·같은 검증(verify) 뒤에 돈다.
  # dist:win = build → prepare:resources(번들 CPython·휠하우스·아이콘·안내 PDF·스킬) →
  # electron-builder --win. fetch:python 은 PBS_TARGET 기본값이 x86_64-pc-windows-msvc 이고,
  # build:wheelhouse 는 번들 python.exe 로 win_amd64 휠을 받는다(pywin32 포함).
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 맥 job 과 같은 확인 — 버전이 네 군데 흩어져 있다.
      - name: 태그와 선언된 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $fail = 0
          foreach ($f in @('app/package.json', '.claude-plugin/plugin.json', '.codex-plugin/plugin.json')) {
            $got = python -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" $f
            if ($got -ne $tag) { Write-Host "::error file=$f::버전 불일치 — 태그 $tag / 파일 $got"; $fail = 1 }
          }
          exit $fail

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # 위 버전 확인용 python. 번들 런타임(3.12)은 fetch:python 이 따로 받는다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # 서명 없음 — CSC_*/APPLE_* 를 넘기지 않는다(formac job 과 달리 env 자체가 없다).
      - name: 설치본 빌드
        working-directory: app
        run: pnpm dist:win

      - name: 체크섬 생성
        working-directory: app/dist
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.exe -File
          if (-not $files) { Write-Error "설치본(*.exe)이 만들어지지 않았습니다"; exit 1 }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            "$h  $($f.Name)"
          }
          # 맥 체크섬(`SHA256SUMS-macos.txt`)을 덮어쓰지 않도록 이름을 나눈다(W2-R1-02).
          $lines | Set-Content -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      # 설치본이 실제로 만들어졌는지 아티팩트로 확인한다(workflow_dispatch 로도 돌 수 있다).
      - name: 설치본 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            app/dist/*.exe
            app/dist/SHA256SUMS-windows.txt
          if-no-files-found: warn
          retention-days: 14

      # 맥 job 이 초안을 만든다(두 job 은 병렬이다). 초안이 나타난 뒤 자산만 더한다.
      - name: 릴리스 초안에 설치본 붙이기
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app/dist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            gh release view $tag --json isDraft 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { Write-Error "초안 릴리스가 10분 안에 나타나지 않았습니다 ($tag)"; exit 1 }
          gh release upload $tag *.exe SHA256SUMS-windows.txt --clobber
