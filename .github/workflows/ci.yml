name: ci
on:
  push:
    branches: ["**"]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNDEFAULTENCODING: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/knuaf-dev/scripts/requirements-runtime.txt
      - run: python -m pip install -r skills/knuaf-dev/scripts/requirements-runtime.txt pytest pytest-timeout
      - run: python -m pytest
  py39-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v5
        id: py39
        with:
          python-version: "3.9"
          update-environment: false
      - run: python -m pip install -r skills/knuaf-dev/scripts/requirements-runtime.txt pytest pytest-timeout
      - run: python -m pytest tests/test_py39_guard.py
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r ../skills/knuaf-dev/scripts/requirements-runtime.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # live-*.spec.ts need a real Claude/Codex login and are excluded without KNUAF_LIVE=1.
      # 창 촬영(window-shots)은 맥 전용 `screencapture` 라 config 의 testIgnore 가 뺀다.
      # 화면 캡처(screenshots.spec.ts 포함)는 CI 에서도 돌려 `KNUAF_SHOT_DIR` 에 남기고 아래에서
      # 아티팩트로 올린다 — 사람이 내려받아 시안과 나란히 본다. 로컬 기본값은 docs/images 그대로다.
      #
      # e2e runs on macOS and Windows alike. `KNUAF_PYTHON` must be an absolute path — the app
      # tests `existsSync(KNUAF_PYTHON)` in choosePython, so a bare name is ignored and it falls
      # back to a PATH python; narrow-PATH specs (those that plant a fake codex) would then hit
      # macOS' stock 3.9.6 and fail project:open. On Windows the interpreter is python.exe.
      - name: e2e (macOS)
        if: runner.os == 'macOS'
        run: pnpm exec playwright test --grep-invert "real window capture"
        env:
          KNUAF_PYTHON: ${{ env.pythonLocation }}/bin/python
          KNUAF_SHOT_DIR: test-results/ui-shots
      - name: e2e (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright test --grep-invert "real window capture"
        env:
          KNUAF_PYTHON: ${{ env.pythonLocation }}\python.exe
          KNUAF_SHOT_DIR: test-results/ui-shots
      # 시안 대조용 캡처 — 시험이 실패해도 남긴다(`always()`). 이름에 OS 를 넣어 구분한다.
      - name: UI captures (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-macos
          path: |
            app/test-results/ui-shots
            app/test-results/onboarding-shots
            app/test-results/p3-shots
            app/test-results/p1-shots
          if-no-files-found: warn
          retention-days: 14
      - name: UI captures (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-windows
          path: |
            app/test-results/ui-shots
            app/test-results/onboarding-shots
            app/test-results/p3-shots
            app/test-results/p1-shots
          if-no-files-found: warn
          retention-days: 14
