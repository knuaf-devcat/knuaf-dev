# .harness.conf — 프로젝트 어댑터 (L2). 소비자 레포 루트에 복사 후 채운다.
# 규칙: 코어 스크립트는 이 파일 밖의 프로젝트 고유값을 모른다. 값 부재 시 코어는 안전측(차단).
# 형식: 허용 키의 KEY="값" 한 줄만 읽힌다(화이트리스트 파싱 — 셸 문법은 실행되지 않음). 값 안에 같은 따옴표 금지.
# 센티널 [2026-07-28]: HARNESS_TYPECHECK/TEST/LINT 값 "none" = 명시적 부재 선언(해당 툴체인이 없는
#   레포 — 순수 bash·스크립트 등). 미설정(차단)과 구별되는 제3상태 — 더미 명령으로 때우지 마라.
# hook 외부 검사에는 저장소 전용 Git 환경이 상속되지 않는다. staged verifier는
# HARNESS_TARGET_REPO / HARNESS_TARGET_INDEX / HARNESS_TARGET_TREE(훅이 확정한 절대 repo·index·tree)를
# 사용한다. cwd repo 일치 확인 후 해당 Git 조회 subprocess에만 GIT_INDEX_FILE을 복원하고 tree를 대조한다.
# 일반 테스트·fixture에는 복원하지 않는다. commit --only의 임시 index도 기본 index로 대체하면 안 된다.

PROJECT_NAME="knuaf-dev 창업논문 도우미"                        # 리뷰 프롬프트·리포트 표기용
HARNESS_TYPECHECK="pnpm -C app typecheck"               # pre-commit·pre-push 차단 검사 1 (없는 레포 = "none")
HARNESS_TEST=".venv-dev/bin/python -m pytest"                         # 차단 검사 2 (⚠️ 자가진단은 훅의 전용 스텝으로 별도로 돈다 — 여기 selftest를 넣으면 이중 실행)
HARNESS_LINT=".venv-dev/bin/python -m ruff check ."                         # pre-push 차단 검사 3 (없는 레포 = "none")
HARNESS_LINT_CHANGED=".venv-dev/bin/python -m ruff check"          # delegate 인너: 변경파일 lint(명령 뒤에 파일 인자들) — 선택
HARNESS_TEST_CHANGED=""  # delegate 인너: 변경연관 테스트 — 선택(미설정 = 전수 백스톱이 커버)
HARNESS_GATE=""   # delegate 전수 백스톱 — 선택(미설정 시 위 3종 자동 합성 · "none"은 합성 제외)
HARNESS_ADVISORY_CMD=""                          # 비차단 부가검사(예: react-doctor --staged) — 선택
HARNESS_EXTRA_TESTS=""                           # 프로젝트 추가 자가테스트(공백 구분 경로) — 선택
REVIEW_PATHS="app/src skills tests"                       # 교차검토 대상 앱 코드 루트
REVIEW_EXTENSIONS="ts tsx js mjs cjs sh py"         # 리뷰 대상 코드 확장자(공백 구분·점 없이) — 기본값이 JS 생태계라
                                                 #   py·go·rs 등 타 언어 레포는 **반드시 선언**(미선언 = 그 언어 변경이 교차검토 밖)
REVIEW_BARE_PATHS=""                             # 확장자 무관 리뷰 경로(무확장자 실행 스크립트 디렉터리) — 선택
REVIEW_EXCLUDE_GLOB="^(app/dist/|app/out/|app/resources/)"               # 리뷰 제외 경로(빌드 생성 데이터 등) — 선택
SECRET_SCAN_CMD="gitleaks detect --no-banner --no-git --source"    # 리뷰/발주 egress 전 시크릿 스캔(파일 인자 1개·발견 시 비0) — 미설정 = egress 금지(fail-closed)
DOMAIN_GUIDE_FILE=""      # delegate GUIDE에 주입할 도메인 절(L2) — 선택
PROTECTED_BRANCHES="main|master"                 # delegate 위임 금지 브랜치 + 리뷰/stamp base 해석 순서(기본 브랜치가 다르면 반드시 등재)
PACKAGE_MANAGER="pnpm"                           # 위임 작업에 허용할 패키지 매니저 (비 JS = "none")
