name: ci
on:
  push:
    branches: ["**"]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNDEFAULTENCODING: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/knuaf-dev/scripts/requirements-runtime.txt
      - run: python -m pip install -r skills/knuaf-dev/scripts/requirements-runtime.txt pytest pytest-timeout
      - run: python -m pytest
  py39-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v5
        id: py39
        with:
          python-version: "3.9"
          update-environment: false
      - run: python -m pip install -r skills/knuaf-dev/scripts/requirements-runtime.txt pytest pytest-timeout
      - run: python -m pytest tests/test_py39_guard.py
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r ../skills/knuaf-dev/scripts/requirements-runtime.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # live-*.spec.ts need a real Claude/Codex login and are excluded without KNUAF_LIVE=1.
      # Screenshot specs regenerate committed PNGs, so they are for local runs only.
      #
      # e2e runs on macOS and Windows alike. `KNUAF_PYTHON` must be an absolute path — the app
      # tests `existsSync(KNUAF_PYTHON)` in choosePython, so a bare name is ignored and it falls
      # back to a PATH python; narrow-PATH specs (those that plant a fake codex) would then hit
      # macOS' stock 3.9.6 and fail project:open. On Windows the interpreter is python.exe.
      - name: e2e (macOS)
        if: runner.os == 'macOS'
        run: pnpm exec playwright test --grep-invert "screenshots|real window capture"
        env:
          KNUAF_PYTHON: ${{ env.pythonLocation }}/bin/python
      - name: e2e (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright test --grep-invert "screenshots|real window capture"
        env:
          KNUAF_PYTHON: ${{ env.pythonLocation }}\python.exe
