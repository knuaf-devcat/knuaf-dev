appId: kr.ac.knuaf.doc.companion
# 이름이 세 군데로 갈린다. 개명하면서 하나씩 실측한 결과다.
#
#  productName    → 헬퍼 번들 이름(KNUAF Thesis Helper Helper.app). 여기에 한글을 쓰면
#                   "… 헬퍼 Helper.app" 이 되어 앱이 시작하자마자 SIGTRAP 으로 죽는다.
#                   설치판의 userData 폴더 이름도 여기서 온다 — 반드시 ASCII.
#  executableName → .app 번들 파일 이름. Finder·응용 프로그램 목록이 보여주는 이름은
#                   CFBundleDisplayName 이 아니라 이 파일 이름이다(서명 없는 빌드에서
#                   확인). 한글을 써야 학생이 한글 이름을 본다. dmg 안에 넣고 봉인을
#                   재검사해 깨지지 않는 것을 확인했다(전에 dmg 의 한글 파일명이 봉인을
#                   깬 적이 있어 그냥 넘기지 않았다).
#  artifactName   → 내려받는 파일 이름. 링크에 %20 이 끼지 않도록 공백 없는 ASCII.
productName: KNUAF Thesis Helper
executableName: 한농대 창업논문 헬퍼
afterSign: scripts/after-sign.mjs
# 정식 서명·공증: Apple Developer 계정이 생기면 CSC_LINK(.p12) / CSC_KEY_PASSWORD /
# APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 를 넣는다. 서명이 있으면
# afterSign 훅의 임시(ad-hoc) 서명은 자동으로 건너뛰고, 아래 mac.notarize 설정에 따라
# 공증까지 진행된다. electron-builder 26에서는 notarize 를 명시하지 않으면 공증하지
# 않으므로(서명만 된 앱은 Gatekeeper가 계속 막는다) 이 키를 지우지 말 것.
# 다운로드 링크에 %20 이 끼지 않도록 파일명은 공백 없이 만든다
# (productName 에는 공백이 있어야 하므로 여기서 따로 지정한다).
artifactName: knuaf-thesis-helper-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: sidecar
    to: sidecar
    filter: ["**/*.py"]
  - from: resources/skill
    to: skill
  - from: resources/python
    to: python
  - from: resources/wheelhouse
    to: wheelhouse
  # 번들 안 파일명은 ASCII만 쓴다. 한글 이름은 APFS 에 NFC 로 저장되는데 dmg 볼륨(HFS+)이
  # NFD 로 바꾸고, 서명은 NFC 로 봉인돼 있어 codesign 이 같은 파일을 "added"이자 "missing"
  # 으로 본다 — "a sealed resource is missing or invalid". zip 은 멀쩡하고 dmg 만 깨진다.
  # 공증까지 가면 이건 실행 자체가 막히는 문제가 된다.
  #
  # 겸사겸사 학생에게 필요한 것만 싣는다. 나머지 docs/ 는 저장소 문서다.
  - from: ../docs/학생용-사용안내.pdf
    to: docs/student-guide.pdf
  - from: ../docs/학생용-사용안내.html
    to: docs/student-guide.html
    filter: ["*.pdf", "*.html", "*.md", "images/**"]
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  extendInfo:
    CFBundleDisplayName: 한농대 창업논문 헬퍼
    CFBundleDocumentTypes:
      - CFBundleTypeName: 논문 작업 폴더
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes: [public.folder]
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # hardenedRuntime + 공증에서는 번들 안의 모든 Mach-O가 서명돼야 한다. 번들 python의
  # 실행파일뿐 아니라 libpython 과 lib-dynload 확장모듈도 포함한다(entitlements 의
  # disable-library-validation 은 '로드'만 허용할 뿐 공증 요건을 대신하지 않는다).
  notarize: true
  binaries:
    - resources/python/bin/python3
    - resources/python/lib/libpython3.12.dylib
    - resources/python/lib/libtcl8.6.dylib
    - resources/python/lib/libtk8.6.dylib
    - resources/python/lib/thread2.8.9/libthread2.8.9.dylib
    - resources/python/lib/itcl4.2.4/libitcl4.2.4.dylib
    - resources/python/lib/python3.12/lib-dynload/_tkinter.cpython-312-darwin.so
    - resources/python/lib/python3.12/lib-dynload/_ctypes_test.cpython-312-darwin.so
    - resources/python/lib/python3.12/lib-dynload/_crypt.cpython-312-darwin.so
win:
  icon: build/icon.ico
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
dmg:
  title: 한농대 창업논문 헬퍼
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - { x: 140, y: 190, type: file }
    - { x: 400, y: 190, type: link, path: /Applications }
